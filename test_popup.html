<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 600px;
      height: 700px;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #ecf0f1;
    }
    .header {
      background: linear-gradient(135deg, #4a90e2, #357abd);
      color: white;
      padding: 16px;
      flex-shrink: 0;
    }
    .stats {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: white;
      flex-shrink: 0;
    }
    .stat-item {
      flex: 1;
      text-align: center;
      padding: 8px;
      background: #ecf0f1;
      border-radius: 4px;
    }
    .tab-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .actions {
      padding: 12px;
      background: white;
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }
    button { flex: 1; padding: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Smart Tab Manager</h2>
    </div>
    <div class="stats">
      <div class="stat-item"><strong>Tabs:</strong> 5</div>
      <div class="stat-item"><strong>Inactive:</strong> 0</div>
      <div class="stat-item"><strong>Duplicates:</strong> 0</div>
    </div>
    <div class="tab-list">
      <p>Test - Tab list would appear here</p>
    </div>
    <div class="actions">
      <button>Run Cleanup</button>
      <button>Close Duplicates</button>
    </div>
  </div>
</body>
</html>
